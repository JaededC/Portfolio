<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Jim Castellvi</title>
    <link href="portfolio_alt.css" rel="stylesheet" />
</head>

<body class="container" id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header>
        <nav aria-label="Main navigation" class="navbar" id="table_of_contents">
            <div class="navlink">
                <a href="index.html">🏠︎ Home</a>
                <a href="about.html">ִ×͜× About Me</a>
                <a href="project.html">☕︎ Projects</a>
                <a href="contact.html" class="active" aria-current="page">
                    ☎ Contact
                </a>
            </div>
        </nav>
    </header>

    <main id="main-content">
        <section class="hero">
            <form action="https://formspree.io/f/mkjodgko" method="POST">
                <div class="hero-text">
                    <h1><span class="gradient-text">Contact</span> Me ✨</h1>

                    <p>
                        Have a question about my projects or an opportunity
                        you'd like to discuss? Send me a message.
                    </p>

                    <div>
                        <label for="first-name">First Name:</label>
                        <input
                            id="first-name"
                            name="first_name"
                            type="text"
                            autocomplete="given-name"
                            required
                        />
                    </div>

                    <div>
                        <label for="last-name">Last Name:</label>
                        <input
                            id="last-name"
                            name="last_name"
                            type="text"
                            autocomplete="family-name"
                            required
                        />
                    </div>

                    <div>
                        <label for="email" style="margin-left: 40px;">
                            Email:
                        </label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        />
                    </div>

                    <div>
                        <label for="subject" style="margin-left: 26px;">
                            Subject:
                        </label>
                        <input
                            id="subject"
                            name="subject"
                            type="text"
                            required
                        />
                    </div>

                    <div>
                        <label for="message">Message:</label>
                    </div>

                    <textarea
                        id="message"
                        name="message"
                        cols="40"
                        rows="5"
                        placeholder="What would you like to discuss?"
                        required
                    ></textarea>

                    <div>
                        <input
                            class="btn"
                            type="submit"
                            value="Send Message"
                        />
                    </div>
                </div>
            </form>

            <div>
                <img
                    src="webtech_img/Moonlit City Lo-Fi Focus.png"
                    alt="Purple Moonlit City"
                    class="hover-tilt hero-photo"
                />
            </div>
        </section>
    </main>

    <footer>
        <p>© Jim Castellvi 2026</p>
    </footer>
</body>

</html>
